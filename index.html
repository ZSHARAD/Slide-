<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zsharad - Galvanized Doors</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e8ebf0;
  }
  .flyer {
    max-width: 600px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    border: 1px solid #dfe3ea;
  }
  .header {
    background: linear-gradient(135deg, #0f1e38, #2d4a7c);
    color: #fff;
    padding: 35px 25px 25px;
    text-align: center;
    position: relative;
  }
  .icon-wrap {
    margin-bottom: 12px;
  }
  .header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
    font-weight: 700;
  }
  .header p {
    margin: 8px 0 0;
    font-size: 14px;
    color: #cfd8e8;
    letter-spacing: 0.5px;
  }
  .divider {
    height: 4px;
    background: repeating-linear-gradient(90deg, #e63946, #e63946 10px, #f1a208 10px, #f1a208 20px);
  }
  .badge-wrap {
    text-align: center;
    margin-top: -28px;
  }
  .badge {
    display: inline-block;
    background: #e63946;
    color: #fff;
    font-weight: bold;
    padding: 16px 26px;
    border-radius: 50px;
    font-size: 24px;
    box-shadow: 0 6px 14px rgba(230,57,70,0.4);
    border: 3px solid #fff;
  }
  .content {
    padding: 35px 30px 20px;
  }
  .content h2 {
    color: #1a2b4c;
    font-size: 19px;
    margin: 0 0 15px;
    text-align: center;
  }
  .features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 0 0 10px;
  }
  .feature {
    background: #f6f8fb;
    border-left: 4px solid #2d4a7c;
    padding: 12px 14px;
    font-size: 14px;
    color: #333;
    border-radius: 6px;
  }
  .contact {
    background: #0f1e38;
    color: #fff;
    padding: 22px 30px;
    text-align: center;
    font-size: 14px;
  }
  .contact div {
    margin: 6px 0;
  }
  .contact a {
    color: #fff;
    text-decoration: none;
  }
  .footer {
    text-align: center;
    padding: 14px;
    font-size: 12px;
    color: #888;
    font-style: italic;
    background: #f6f8fb;
  }
  .door-icon svg {
    width: 46px;
    height: 46px;
  }
</style>
</head>
<body>
  <div class="flyer">
    <div class="header">
      <div class="icon-wrap door-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="2" width="16" height="20" rx="1" fill="#f1a208" stroke="#fff" stroke-width="1"/>
          <circle cx="15" cy="12" r="1.3" fill="#0f1e38"/>
        </svg>
      </div>
      <h1>ZSHARAD</h1>
      <p>HOT-DIP GALVANIZED DOORS &nbsp;|&nbsp; HOME &amp; COMMERCIAL</p>
    </div>
    <div class="divider"></div>

    <div class="badge-wrap">
      <div class="badge">25% OFF</div>
    </div>

    <div class="content">
      <h2>Built to Last. Rust-Proof. Reliable.</h2>
      <div class="features">
        <div class="feature">🛡️ Rust & corrosion resistant</div>
        <div class="feature">🔒 Heavy-duty security</div>
        <div class="feature">📐 Custom sizes available</div>
        <div class="feature">🏠 Home & commercial fit</div>
      </div>
    </div>

    <div class="contact">
      <div>📞 +91 898 237 9366</div>
      <div>📧 Sales.zsharad@gmail.com</div>
      <div>🌐 zsharad.online</div>
